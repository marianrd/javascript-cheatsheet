<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adopción de Mascotas - Examen de JavaScript</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="adopcion-container">
      <header>
        <h1>🐾 Adopción de Mascotas</h1>
        <p class="subtitle">Conectá con animales que buscan un hogar lleno de amor</p>
      </header>

      <section class="filters">
        <select id="filtroEspecie" class="filter-select">
          <option value="">Todas las especies</option>
        </select>
      </section>

      <!-- ========================================================================= -->
      <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Renderizado de tarjetas en Grid): -->
      <!--
        <div class="animal-card">
          <div class="card-image-wrap">
            <img src="${animal.imagen}" alt="${animal.nombre}" class="card-image" />
            <span class="card-species-badge badge-${animal.especie}">${animal.especie}</span>
            <span class="card-age-badge">${animal.edad}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${animal.nombre}</h3>
            <p class="card-breed">${animal.raza} &bull; ${animal.sexo}</p>
            <p class="card-shelter"><i class="fas fa-home"></i> ${animal.refugio}</p>
            <p class="card-description">${animal.descripcion}</p>
            <button type="button" class="btn-primary btn-adoptar" data-id="${animal.id}">
              <i class="fas fa-heart"></i> Conocer y Adoptar
            </button>
          </div>
        </div>
      -->
      <!-- ========================================================================= -->

      <section class="catalog">
        <div id="catalogoGrid" class="cards-grid"></div>
      </section>

      <!-- Modal Ficha y Adopción -->
      <div id="modalDetalle" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>🐾 Ficha y Solicitud de Adopción</h3>
            <button type="button" class="cerrar-modal">&times;</button>
          </div>

          <!-- ======================================================================= -->
          <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Detalle del animal en modal):   -->
          <!--
            <div class="detail-header-info">
              <img src="${animal.imagen}" alt="${animal.nombre}" class="detail-img" />
              <div>
                <h4>${animal.nombre} (${animal.raza})</h4>
                <div class="detail-meta-grid">
                  <div class="detail-meta-item"><strong>Especie:</strong> ${animal.especie}</div>
                  <div class="detail-meta-item"><strong>Edad:</strong> ${animal.edad}</div>
                  <div class="detail-meta-item"><strong>Tamaño:</strong> ${animal.tamaño}</div>
                  <div class="detail-meta-item"><strong>Refugio:</strong> ${animal.refugio}</div>
                </div>
              </div>
            </div>
            <div class="detail-history">
              <strong>Historia:</strong> ${animal.historia}
            </div>
          -->
          <!-- ======================================================================= -->

          <div id="detalleContent" class="detail-body"></div>

          <form id="formAdopcion" class="adoption-form">
            <h4><i class="fas fa-file-signature"></i> Datos del Solicitante</h4>
            <div class="form-grid">
              <div class="form-group">
                <label for="inputNombreAdoptante">Nombre y Apellido</label>
                <input
                  type="text"
                  id="inputNombreAdoptante"
                  name="nombreAdoptante"
                  required
                  placeholder="Ej: Laura Gómez"
                />
              </div>
              <div class="form-group">
                <label for="inputTelefono">Teléfono de Contacto</label>
                <input
                  type="tel"
                  id="inputTelefono"
                  name="telefono"
                  required
                  placeholder="Ej: 351-1234567"
                />
              </div>
            </div>
            <button type="submit" id="btnConfirmarAdopcion" class="btn-primary">
              <i class="fas fa-heart"></i> Confirmar Solicitud
            </button>
          </form>
          <button type="button" class="btn-cerrar cerrar-modal">Cerrar</button>
        </div>
      </div>

      <!-- Sección Historial de Solicitudes -->
      <section class="solicitudes-section">
        <div class="solicitudes-header">
          <h2><i class="fas fa-clipboard-list"></i> Mis Solicitudes de Adopción</h2>
          <button type="button" id="btnLimpiarSolicitudes" class="btn-outline">
            <i class="fas fa-trash"></i> Limpiar Historial
          </button>
        </div>

        <!-- ======================================================================= -->
        <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Item de Solicitud guardada):    -->
        <!--
          <div class="solicitud-card">
            <div class="solicitud-info">
              <h4>🐾 Solicitud para: ${sol.animalNombre} (${sol.especie})</h4>
              <p><strong>Solicitante:</strong> ${sol.solicitante} &bull; <strong>Tel:</strong> ${sol.telefono} &bull; <strong>Fecha:</strong> ${sol.fecha}</p>
            </div>
            <span class="solicitud-badge">En Revisión</span>
          </div>
        -->
        <!-- ======================================================================= -->

        <div id="solicitudesLista" class="solicitudes-list"></div>
      </section>
    </div>
  <script src="js/script.js"></script>
  </body>
</html>
